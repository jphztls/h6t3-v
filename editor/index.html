<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JRN-1-editor</title>
<meta name="description" content="Editor dell'interfaccia di JRN-1: modifica misure e stile, poi esporta un file da passare a Claude.">
<style>
:root {
  --surface: #ffffff; --ink: #000000; --hl: #ff3b30;
  --font: "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono: Menlo, "SF Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --surface: #000000; --ink: #ffffff; color-scheme: dark; } }
:root[data-theme="dark"] { --surface: #000000; --ink: #ffffff; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--surface); color: var(--ink); font: 400 14px/20px var(--font); }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: var(--surface); border: 1px solid var(--ink); height: 28px; padding: 0 10px; cursor: pointer; border-radius: 0; }
button:hover { background: var(--ink); color: var(--surface); }
button.on { background: var(--ink); color: var(--surface); }
button:disabled { opacity: .35; cursor: default; background: var(--surface); color: var(--ink); }
input[type=number], input[type=text], select, textarea { background: var(--surface); border: 1px solid var(--ink); border-radius: 0; height: 26px; padding: 0 6px; min-width: 0; }
textarea { height: auto; padding: 6px; resize: vertical; width: 100%; line-height: 18px; }
input[type=color] { width: 34px; height: 26px; padding: 0; border: 1px solid var(--ink); background: none; }
.app { display: grid; grid-template-columns: 330px 1fr 330px; grid-template-rows: 44px 1fr; height: 100vh; }
header { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid var(--ink); white-space: nowrap; }
header .t { font-weight: 700; margin-right: 6px; }
header .src { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.seg { display: inline-flex; } .seg button + button { margin-left: -1px; }
aside { overflow-y: auto; min-height: 0; }
#left { border-right: 1px solid var(--ink); }
#right { border-left: 1px solid var(--ink); }
.grp > summary { list-style: none; cursor: pointer; padding: 8px 12px; border-bottom: 1px solid var(--ink); display: flex; justify-content: space-between; user-select: none; }
.grp > summary::-webkit-details-marker { display: none; }
.grp > summary::after { content: "+"; }
.grp[open] > summary::after { content: "−"; }
.grp .n { font-variant-numeric: tabular-nums; }
.rows { padding: 6px 12px 10px; border-bottom: 1px solid var(--ink); }
.row { display: grid; grid-template-columns: 10px 1fr 112px 22px; align-items: center; gap: 6px; min-height: 30px; }
.row .dot { width: 6px; height: 6px; border-radius: 50%; }
.row.chg .dot { background: var(--hl); }
.row label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row label small { opacity: 1; font-size: 11px; }
.row .in { display: flex; gap: 4px; align-items: center; justify-content: flex-end; }
.row .in input[type=number] { width: 70px; text-align: right; }
.row .in input[type=text] { width: 112px; }
.row .in select { width: 112px; }
.row .u { width: 18px; font-size: 12px; }
.row .rs { width: 22px; height: 22px; padding: 0; border: 0; visibility: hidden; }
.row.chg .rs { visibility: visible; }
.row.hot label { text-decoration: underline; text-underline-offset: 3px; }
.hint { padding: 8px 12px; border-bottom: 1px solid var(--ink); font-size: 12px; line-height: 17px; }
main { position: relative; overflow: auto; min-height: 0; }
#tools { position: sticky; top: 0; left: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 12px; background: var(--surface); border-bottom: 1px solid var(--ink); }
#stage { display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start; justify-content: center; padding: 28px; }
.dev { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.dev .cap { font-size: 12px; font-variant-numeric: tabular-nums; }
.dev .fr { border: 1px solid var(--ink); outline: 6px solid var(--ink); border-radius: 2px; overflow: hidden; transform-origin: 0 0; }
.dev .wrap { position: relative; }
iframe { display: block; border: 0; background: #fff; }
#right h3 { margin: 0; padding: 8px 12px; font-size: 14px; border-bottom: 1px solid var(--ink); display: flex; justify-content: space-between; gap: 8px; }
.sec { padding: 10px 12px; border-bottom: 1px solid var(--ink); }
.sec .lbl { font-size: 12px; margin-bottom: 4px; display: block; }
.kv { display: grid; grid-template-columns: 1fr 120px; gap: 4px 8px; align-items: center; }
.kv input { width: 100%; }
.mono { font-family: var(--mono); font-size: 12px; }
.chg-list { font-size: 12px; line-height: 17px; }
.chg-list div { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; }
.chg-list b { font-weight: 400; font-variant-numeric: tabular-nums; white-space: nowrap; }
.empty { font-size: 12px; }
#toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 6px 12px; display: none; z-index: 9; }
#fileIn, #jrnIn { display: none; }
@media (max-width: 1100px) { .app { grid-template-columns: 290px 1fr 290px; } }
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto auto auto auto; height: auto; }
  header { flex-wrap: wrap; height: auto; padding: 8px 16px; white-space: normal; }
  #left, #right { border: 0; border-top: 1px solid var(--ink); }
  main { overflow: auto; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <span class="t">JRN-1-editor</span>
    <span class="src" id="src">Carico JRN-1…</span>
    <button id="undo" title="Annulla (Ctrl+Z)">Annulla</button>
    <button id="redo" title="Ripeti (Ctrl+Shift+Z)">Ripeti</button>
    <button id="reset">Ripristina tutto</button>
    <button id="imp">Importa</button>
    <button id="copy">Copia per Claude</button>
    <button id="exp" class="on">Esporta file</button>
    <input type="file" id="fileIn" accept=".json,application/json">
  </header>

  <aside id="left"></aside>

  <main>
    <div id="tools">
      <span class="seg" id="vOri"><button data-v="both">Entrambe</button><button data-v="port">Verticale</button><button data-v="land">Orizzontale</button></span>
      <span class="seg" id="vTheme"><button data-v="light">Chiaro</button><button data-v="dark">Scuro</button></span>
      <span class="seg" id="vScreen"><button data-v="consulta">Feed</button><button data-v="cartelle">DIR</button><button data-v="calendario">CAL</button><button data-v="registra">REC</button></span>
      <span class="seg" id="vZoom"><button data-v="1">1×</button><button data-v="1.5">1,5×</button><button data-v="2">2×</button></span>
      <button id="pick" class="on" title="Clic su un elemento dell'anteprima per modificarlo">Seleziona</button>
    </div>
    <div id="stage">
      <div class="dev" id="devP"><div class="wrap"><div class="fr"><iframe id="fP" title="JRN-1 verticale"></iframe></div></div><div class="cap" id="capP"></div></div>
      <div class="dev" id="devL"><div class="wrap"><div class="fr"><iframe id="fL" title="JRN-1 orizzontale"></iframe></div></div><div class="cap" id="capL"></div></div>
    </div>
  </main>

  <aside id="right">
    <h3><span id="selName">Nessun elemento</span><span class="mono" id="selSize"></span></h3>
    <div id="insp">
      <div class="hint">Clicca un elemento nell'anteprima: qui compaiono le sue misure, le proprietà da cambiare e un campo per le note. I parametri a sinistra legati all'elemento vengono sottolineati.</div>
    </div>
    <div class="sec">
      <span class="lbl">Note generali per Claude</span>
      <textarea id="noteGen" rows="4" placeholder=""></textarea>
    </div>
    <div class="sec">
      <span class="lbl">Modifiche (<span id="chgN">0</span>)</span>
      <div class="chg-list" id="chgList"></div>
    </div>
  </aside>
</div>
<div id="toast"></div>
<input type="file" id="jrnIn" accept=".html,text/html">

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
const toast = (t) => { const el = $("toast"); el.textContent = t; el.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => (el.style.display = "none"), 1800); };

/* ============ Parametri: valori di partenza = JRN-1 attuale ============ */
// el: selettore dell'elemento a cui il parametro è legato (per l'ispettore). js: letto dallo script di JRN-1, non dal CSS.
const P = [
  // Token
  { id: "tok.font", g: "Token", l: "Font", t: "text", d: '"Helvetica Neue", Helvetica, Arial, sans-serif', el: "#app" },

  { id: "tok.s1", g: "Token", l: "Spazio 1", d: 4, u: "px", min: 0, max: 40 },

  { id: "col.lbg", g: "Colori", l: "Chiaro: sfondo", t: "color", d: "#ffffff" },

  // Barra in alto

  { id: "top.px", g: "Barra in alto", l: "Margine laterale", d: 12, u: "px", min: 0, max: 60, el: ".top" },
  { id: "theme.s", g: "Barra in alto", l: "Pallino tema", d: 14, u: "px", min: 4, max: 40, el: "#theme" },
  // Display 2

  { id: "bar.mt", g: "Display 1 e frecce", l: "Distanza dal Display 2", d: 8, u: "px", min: 0, max: 60, el: "#bar" },
  { id: "bar.mx", g: "Display 1 e frecce", l: "Margine laterale", d: 12, u: "px", min: 0, max: 60, el: "#bar" },

  { id: "arr.icon", g: "Display 1 e frecce", l: "Triangolo freccia", d: 12, u: "px", min: 4, max: 40, el: "#arrows button" },
  { id: "arr.side", g: "Display 1 e frecce", l: "Frecce", t: "sel", o: ["destra", "sinistra"], d: "destra", el: "#arrows" },
  { id: "vu.h", g: "Display 1 e frecce", l: "VU meter: altezza", d: 12, u: "px", min: 2, max: 40, el: "#d1" },
  // Controlli
  { id: "ctl.pt", g: "Shift e ghiera", l: "Spazio sopra i controlli", d: 16, u: "px", min: 0, max: 80, el: "#ctl" },
  { id: "ctl.px", g: "Shift e ghiera", l: "Margine laterale", d: 12, u: "px", min: 0, max: 80, el: "#ctl" },
  { id: "ctl.pb", g: "Shift e ghiera", l: "Spazio sotto i controlli", d: 8, u: "px", min: 0, max: 80, el: "#ctl" },
  { id: "shift.w", g: "Shift e ghiera", l: "Shift: larghezza", d: 72, u: "px", min: 20, max: 200, el: "#shift" },
  { id: "shift.h", g: "Shift e ghiera", l: "Shift: altezza (0 = come ghiera)", d: 0, u: "px", min: 0, max: 400, el: "#shift", js: 1 },
  { id: "shift.r", g: "Shift e ghiera", l: "Shift: raggio angoli", d: 9999, u: "px", min: 0, max: 9999, el: "#shift" },
  { id: "led.size", g: "Shift e ghiera", l: "LED: diametro", d: 16, u: "px", min: 2, max: 60, el: ".led", js: 1 },
  { id: "dial.size", g: "Shift e ghiera", l: "Ghiera: diametro fisso (0 = auto)", d: 0, u: "px", min: 0, max: 400, el: "#dial", js: 1 },
  { id: "dial.min", g: "Shift e ghiera", l: "Ghiera auto: minimo", d: 150, u: "px", min: 40, max: 400, el: "#dial", js: 1 },
  { id: "dial.max", g: "Shift e ghiera", l: "Ghiera auto: massimo", d: 220, u: "px", min: 40, max: 400, el: "#dial", js: 1 },
  { id: "dial.wpct", g: "Shift e ghiera", l: "Ghiera auto: % larghezza", d: 58, u: "%", min: 10, max: 100, el: "#dial", js: 1 },
  { id: "dial.hpct", g: "Shift e ghiera", l: "Ghiera auto: % altezza", d: 28, u: "%", min: 5, max: 60, el: "#dial", js: 1 },

  { id: "dial.dotr", g: "Shift e ghiera", l: "Ghiera: raggio pallini", d: 3.5, u: "%", min: 0.5, max: 20, step: 0.5, el: "#dial", js: 1 },
  { id: "dial.ring", g: "Shift e ghiera", l: "Ghiera: distanza pallini", d: 82, u: "%", min: 10, max: 98, el: "#dial", js: 1 },
  { id: "dial.centerShow", g: "Shift e ghiera", l: "Mostra zona centrale (solo anteprima)", t: "sel", o: ["no", "sì"], d: "no", el: "#dial", js: 1, preview: 1 },
  // Orizzontale
  { id: "land.d1", g: "Orizzontale", l: "Display 1: altezza relativa", d: 0.7, u: "fr", min: 0.2, max: 3, step: 0.05, el: "#bar" },

  { id: "sim.side", g: "Simulazione iPhone", l: "Orizzontale: zona notch", d: 50, u: "pt", min: 0, max: 80, sim: 1 },
  { id: "sim.lbot", g: "Simulazione iPhone", l: "Orizzontale: zona in basso", d: 21, u: "pt", min: 0, max: 60, sim: 1 },
];
const PI = Object.fromEntries(P.map((p) => [p.id, p]));

/* Regole CSS: ognuna scatta se almeno uno dei suoi parametri è cambiato. Selettori uguali a quelli di JRN-1. */
const R = [
  { ids: ["tok.font", "tok.size", "tok.lh", "tok.weight"], css: (v) => `:root { --font-sans: ${v("tok.font")}; --text: ${v("tok.weight")} ${v("tok.size")}px/${v("tok.lh")}px var(--font-sans); }` },
  { ids: ["tok.s1"], css: (v) => `:root { --space-1: ${v("tok.s1")}px; }` },
  { ids: ["tok.s2"], css: (v) => `:root { --space-2: ${v("tok.s2")}px; }` },
  { ids: ["tok.s3"], css: (v) => `:root { --space-3: ${v("tok.s3")}px; }` },
  { ids: ["tok.s4"], css: (v) => `:root { --space-4: ${v("tok.s4")}px; }` },
  { ids: ["tok.line"], css: (v) => `:root { --border-hairline: ${v("tok.line")}px; }` },
  { ids: ["tok.ctl"], css: (v) => `:root { --control-height: ${v("tok.ctl")}px; }` },
  { ids: ["col.lbg", "col.link"], css: (v) => `:root { --surface: ${v("col.lbg")}; --ink: ${v("col.link")}; --on-ink: ${v("col.lbg")}; }` },
  { ids: ["col.dbg", "col.dink"], css: (v) => `:root[data-theme="dark"] { --surface: ${v("col.dbg")}; --ink: ${v("col.dink")}; --on-ink: ${v("col.dbg")}; }` },
  { ids: ["col.led"], css: (v) => `:root { --led: ${v("col.led")}; }` },

}
function setFree(key, k, x) {
  const o = S.free[key] || (S.free[key] = {});
  if (x) o[k] = x; else delete o[k];
  if (!Object.keys(o).length) delete S.free[key];
  commit(); applyAll();
}
$("noteGen").value = S.general || "";
$("noteGen").oninput = (e) => { S.general = e.target.value; commit(); };

/* ============ Elenco modifiche ============ */
function changeList() {
  return P.filter((p) => !p.sim && !p.preview && changed(p.id)).map((p) => ({ id: p.id, gruppo: p.g, parametro: p.l, da: p.d, a: val(p.id), unita: p.u || "", dove: p.js ? "script: " + JSDOC[p.id] : "css" }));
}
function renderChanges() {
  const L = changeList(), F = Object.keys(S.free), N = Object.keys(S.notes);
  $("chgN").textContent = L.length + F.length + N.length;
  const h = [];
  for (const c of L) h.push(`<div><span>${c.parametro}</span><b>${c.da} → ${c.a}${c.unita && c.unita.length < 3 ? " " + c.unita : ""}</b></div>`);
  for (const k of F) { const [sc, s] = splitKey(k); h.push(`<div><span>${ELNAME[s] || s}${sc !== "all" ? " (" + (sc === "port" ? "vert." : "oriz.") + ")" : ""}</span><b class="mono">${Object.entries(S.free[k]).map(([a, b]) => a + ": " + b).join("; ")}</b></div>`); }
  for (const s of N) h.push(`<div><span>Nota: ${ELNAME[s] || s}</span><b>✎</b></div>`);
  $("chgList").innerHTML = h.join("") || '<span class="empty">Ancora nessuna modifica.</span>';
}

/* ============ Export / import ============ */
function exportObj() {
  const free = Object.keys(S.free).map((k) => { const [sc, s] = splitKey(k); return { elemento: ELNAME[s] || s, selettore: s, vale_per: sc === "all" ? "entrambe" : sc === "port" ? "verticale" : "orizzontale", proprieta: S.free[k] }; });
  const tokens = {};
  const tmap = { "tok.s1": "--space-1", "tok.s2": "--space-2", "tok.s3": "--space-3", "tok.s4": "--space-4", "tok.line": "--border-hairline", "tok.ctl": "--control-height", "col.led": "--led", "tok.font": "--font-sans" };
  for (const id in tmap) if (changed(id)) tokens[tmap[id]] = typeof val(id) === "number" ? val(id) + "px" : val(id);
  if (["tok.size", "tok.lh", "tok.weight", "tok.font"].some(changed)) tokens["--text"] = `${val("tok.weight")} ${val("tok.size")}px/${val("tok.lh")}px var(--font-sans)`;
  return {
    formato: "JRN-1-editor modifiche UI", versione: 1, app: "JRN-1", base: JRN && JRN.base ? JRN.base : "", data: new Date().toISOString(),
    istruzioni: "Applica a JRN-1 (repo h6t3-v) le modifiche qui sotto. 'css' contiene le regole pronte: valgono dopo il CSS attuale, stessi selettori. I parametri con dove='script: …' vanno cambiati nel codice indicato. Leggi le note.",
    schermo_simulato: { larghezza: val("sim.w"), altezza: val("sim.h"), zona_sicura_alto: val("sim.top"), zona_sicura_basso: val("sim.bot") },
    modifiche: changeList(), token: tokens, proprieta_libere: free,
    note_generali: S.general || "", note_elementi: Object.keys(S.notes).map((s) => ({ elemento: ELNAME[s] || s, selettore: s, nota: S.notes[s] })),
    css: [cssOverrides(), cssFree()].filter(Boolean).join("\n"),
    script: Object.fromEntries(P.filter((p) => p.js && !p.preview && changed(p.id)).map((p) => [p.id, val(p.id)])),
    stato_editor: S,
  };
}
function stamp() { const d = new Date(), p = (n) => String(n).padStart(2, "0"); return String(d.getFullYear() % 100) + p(d.getMonth() + 1) + p(d.getDate()) + "_" + p(d.getHours()) + p(d.getMinutes()); }
$("exp").onclick = () => {
  const b = new Blob([JSON.stringify(exportObj(), null, 2)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "jrn1-ui-" + stamp() + ".json"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast("File salvato: passalo a Claude nel thread di JRN-1");
};
$("copy").onclick = async () => {
  const o = exportObj(); delete o.stato_editor;
  const txt = "Modifiche all'interfaccia di JRN-1 fatte con JRN-1-editor. Applicale:\n\n```json\n" + JSON.stringify(o, null, 2) + "\n```";
  try { await navigator.clipboard.writeText(txt); toast("Copiato: incollalo nel thread di JRN-1"); }
  catch (e) { const t = document.createElement("textarea"); t.value = txt; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); toast("Copiato"); }
};
$("imp").onclick = () => $("fileIn").click();
$("fileIn").onchange = async (e) => {
  const f = e.target.files[0]; if (!f) return; e.target.value = "";
  try { const o = JSON.parse(await f.text()); const st = o.stato_editor || o; if (!st.v) throw 0; undoS.push(JSON.stringify(S)); restore(JSON.stringify(Object.assign(blank(), st))); toast("Importato"); }
  catch (er) { toast("File non riconosciuto"); }
};

/* ============ Barra strumenti ============ */
function seg(id, key, after) {
  const box = $(id);
  const paint = () => box.querySelectorAll("button").forEach((b) => b.classList.toggle("on", String(V[key]) === b.dataset.v));
  box.addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; V[key] = b.dataset.v; store.set("edt1-view", V); paint(); after && after(); });
  paint();
}
seg("vOri", "ori", applyAll);
seg("vTheme", "theme", applyAll);
seg("vScreen", "screen", () => { applyAll(); });
seg("vZoom", "zoom", layoutStage);
const paintPick = () => $("pick").classList.toggle("on", V.pick);
$("pick").onclick = () => { V.pick = !V.pick; store.set("edt1-view", V); paintPick(); applyAll(); };
paintPick();
window.addEventListener("resize", () => { for (const k of ["P", "L"]) drawHl(frames[k]); });

/* ============ Avvio ============ */
(async () => {
  buildLeft(); updUndo(); layoutStage(); renderChanges();
  const ok = await loadJrn(); setSrc();
  if (!ok) { $("src").innerHTML = 'Non riesco a leggere JRN-1. <button id="pickJrn">Apri index.html di JRN-1…</button>'; $("pickJrn").onclick = () => $("jrnIn").click(); return; }
  buildFrames();
})();
$("jrnIn").onchange = async (e) => { const f = e.target.files[0]; if (!f) return; const g = parseJrn(await f.text()); if (!g) { toast("Non è JRN-1"); return; } JRN = Object.assign(g, { base: "", from: "da file" }); setSrc(); buildFrames(); };
</script>
