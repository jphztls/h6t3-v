<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<!-- Privacy: il browser non può inviare dati a nessun altro indirizzo. Tutto resta sul telefono. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>JRN-1</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="JRN-1">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<style>
/* --- Token Grado Zero: solo bianco e nero, linee 1px, un'unica dimensione di testo --- */
:root {
  --surface: #ffffff; --ink: #000000; --on-ink: #ffffff;
  --line: var(--ink); --surface-inverse: var(--ink); --ink-inverse: var(--on-ink);
  --font-sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
  --border-hairline: 1px; --control-height: 28px;
  --text: 400 16px/22px var(--font-sans);
  --led: #ff3b30;
  color-scheme: light;
}
:root[data-theme="dark"] { --surface: #000000; --ink: #ffffff; --on-ink: #000000; color-scheme: dark; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
html, body { margin: 0; position: fixed; inset: 0; overflow: hidden; overscroll-behavior: none; background: var(--surface); color: var(--ink); font: var(--text); }
button { font: var(--text); color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.box { border: var(--border-hairline) solid var(--line); }

#app { position: fixed; left: 0; right: 0; top: 0; bottom: 0; margin: 0 auto; max-width: 430px; display: flex; flex-direction: column;
  padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
.top { flex: none; display: flex; align-items: center; justify-content: space-between; height: 30px; padding: 0 var(--space-3); }
.top .theme { width: var(--control-height); height: var(--control-height); display: flex; align-items: center; justify-content: flex-end; }

/* Display 2: il feed, dentro un riquadro */
#d2 { position: relative; flex: 1; min-height: 120px; margin: var(--space-1) var(--space-3) 0; overflow: hidden; }
.scroll { position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; touch-action: pan-y; background: var(--surface); }
.it { padding: var(--space-2) var(--space-3) var(--space-3); border-top: var(--border-hairline) solid var(--line); }
.it:first-child { border-top: 0; }
.it .nm { display: inline-block; padding: 0 3px; margin: 0 -3px 4px; font-variant-numeric: tabular-nums; }
.it.sel .nm { background: var(--surface-inverse); color: var(--ink-inverse); }
.it .tx { white-space: pre-wrap; word-wrap: break-word; display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; }
.it img { display: block; width: 100%; max-height: 260px; object-fit: contain; object-position: left center; }
.it canvas.wf { display: block; width: 100%; height: 34px; }

#detail, #menu { display: none; }
#d2.show-detail #detail, #d2.show-menu #menu { display: block; }
#d2.show-detail #feed, #d2.show-menu #feed { visibility: hidden; }
#detail { padding: var(--space-3); }
#detail .tx { white-space: pre-wrap; word-wrap: break-word; -webkit-user-select: text; user-select: text; }
#detail img { display: block; width: 100%; height: auto; }
#detail canvas.wf { display: block; width: 100%; height: 80px; margin-top: var(--space-3); }
#detail iframe { width: 100%; height: 100%; border: 0; background: #fff; }
.mrow { height: 36px; display: flex; align-items: center; justify-content: space-between; padding: 0 var(--space-3); }
.mrow.sel { background: var(--surface-inverse); color: var(--ink-inverse); }

/* Barra: mode select + Display 1 (una riga) */
#bar { flex: none; display: flex; gap: 0; height: 44px; margin: var(--space-2) var(--space-3) 0; }
#bar .ms { flex: none; height: 100%; aspect-ratio: 1 / 1; margin-right: -1px; display: flex; align-items: center; justify-content: center; }
#bar .ms.down { background: var(--surface-inverse); color: var(--ink-inverse); }
#bar .ms svg { width: 12px; height: 12px; fill: currentColor; }
#d1 { position: relative; flex: 1; min-width: 0; overflow: hidden; }
#d1 .l1 { position: absolute; inset: 0; display: flex; align-items: center; padding: 0 var(--space-3); white-space: nowrap; overflow: hidden; }
#d1 canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: none; }
#d1.meter canvas { display: block; }
#d1 #ed { display: none; position: absolute; inset: 0; padding: 0 var(--space-3); overflow: hidden; white-space: pre; align-items: center; }
#ed .car { display: inline-block; width: 0; border-left: var(--border-hairline) solid var(--ink); margin-right: -1px; height: 20px; vertical-align: -4px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { visibility: hidden; } }

/* Controlli in basso: Shift alto quanto la ghiera */
#ctl { position: relative; flex: none; display: flex; align-items: center; justify-content: space-between; padding: var(--space-4) var(--space-3) var(--space-3); }
#shift { position: relative; width: 72px; border-radius: 9999px; touch-action: none; }
#shift.down { background: var(--surface-inverse); }
.led { position: absolute; left: 50%; bottom: 24px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; border: var(--border-hairline) solid var(--line); }
.led.on { background: var(--ink); }
#shift.down .led { border-color: var(--on-ink); }
#shift.down .led.on { background: var(--on-ink); }
.led.rec { background: var(--led); border-color: var(--led) !important; animation: blink 1s steps(1) infinite; }
#dial { display: block; touch-action: none; }
#strip { display: none; touch-action: none; }
#kb { display: none; }

/* --- Orizzontale: 6 righe uguali (Display 1, 4 file di tastiera, Shift + striscia) --- */
body.land #app { max-width: none; display: grid; grid-template-rows: repeat(6, 1fr); row-gap: 6px;
  padding: var(--space-2) max(var(--space-2), env(safe-area-inset-right)) max(var(--space-2), env(safe-area-inset-bottom)) max(var(--space-2), env(safe-area-inset-left)); }
body.land .top, body.land #d2, body.land #dial { display: none; }
body.land #bar { grid-row: 1; height: auto; margin: 0; min-height: 0; }
body.land #bar .ms { order: 2; margin-right: 0; margin-left: -1px; }
body.land #d1 #ed { display: flex; }
body.land #d1 .l1, body.land #d1 canvas { display: none; }
body.land #kb { grid-row: 2 / 6; display: flex; flex-direction: column; gap: 1px; min-height: 0; background: var(--line); border: var(--border-hairline) solid var(--line); }
.kr { display: flex; gap: 1px; flex: 1; min-height: 0; }
.k { flex: 1 1 0; min-width: 0; display: flex; align-items: center; justify-content: center; background: var(--surface); touch-action: none; }
.k.w15 { flex-grow: 1.5; } .k.w6 { flex-grow: 6; }
.k.down, .k.lit { background: var(--surface-inverse); color: var(--ink-inverse); }
body.land #ctl { grid-row: 6; padding: 0; gap: 28px; min-height: 0; }
body.land #shift { height: 100%; width: 140px; flex: none; }
body.land .led { left: 16px; top: 50%; bottom: auto; margin: -6px 0 0; }
body.land #strip { display: block; flex: 1; height: 100%; }

#fin, #fzip { display: none; }
</style>
</head>
<body>
<div id="app">
  <div class="top"><span>JRN-1</span><button class="theme" id="theme" aria-label="Tema"><svg viewBox="0 0 16 16" width="14" height="14"><circle cx="8" cy="8" r="8" fill="currentColor"/></svg></button></div>
  <div id="d2" class="box">
    <div id="feed" class="scroll"></div>
    <div id="detail" class="scroll"></div>
    <div id="menu" class="scroll"></div>
  </div>
  <div id="bar">
    <button class="ms box" id="prev" aria-label="Modalità precedente"><svg viewBox="0 0 12 12"><path d="M9 1 L3 6 L9 11 Z"/></svg></button>
    <button class="ms box" id="next" aria-label="Modalità successiva"><svg viewBox="0 0 12 12"><path d="M3 1 L9 6 L3 11 Z"/></svg></button>
    <div id="d1" class="box"><div class="l1"><span id="d1a"></span></div><canvas id="d1c"></canvas><div id="ed"></div></div>
  </div>
  <div id="kb"></div>
  <div id="ctl">
    <button id="shift" class="box" aria-label="Shift"><i class="led" id="led"></i></button>
    <canvas id="dial" aria-label="Ghiera"></canvas>
    <canvas id="strip" class="box" aria-label="Striscia di scorrimento"></canvas>
  </div>
</div>
<input type="file" id="fin">
<input type="file" id="fzip" accept=".zip,application/zip">
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
["gesturestart", "gesturechange", "gestureend"].forEach((t) => document.addEventListener(t, (e) => e.preventDefault()));
document.addEventListener("touchmove", (e) => { if (!e.target.closest || !e.target.closest(".scroll, #ed")) e.preventDefault(); }, { passive: false });
document.addEventListener("dblclick", (e) => e.preventDefault());
const DPR = Math.min(window.devicePixelRatio || 1, 3);

const S = { mode: 0, theme: "dark", sound: "1" };
try { Object.assign(S, JSON.parse(store.get("jrn1-set", "{}"))); } catch (e) {}
const saveS = () => store.set("jrn1-set", JSON.stringify(S));
document.documentElement.dataset.theme = S.theme;

/* ============ Archivio interno: IndexedDB, solo sul telefono ============ */
let db = null;
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open("jrn1", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("items", { keyPath: "name" });
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
const tx = (mode, fn) => new Promise((res, rej) => { const t = db.transaction("items", mode), s = t.objectStore("items"); const out = fn(s); t.oncomplete = () => res(out && out.result); t.onerror = () => rej(t.error); });
const dbAll = () => tx("readonly", (s) => s.getAll());
const dbPut = (it) => tx("readwrite", (s) => s.put(it));
const dbDel = (name) => tx("readwrite", (s) => s.delete(name));
const dbClear = () => tx("readwrite", (s) => s.clear());

let items = [];                                       // dal più recente al più vecchio
const pad = (n, l) => String(n).padStart(l || 2, "0");
const ymd = (d) => pad(d.getFullYear() % 100) + pad(d.getMonth() + 1) + pad(d.getDate());
const parseName = (n) => { const m = /^(\d{6})_(\d+)$/.exec(n); return m ? [m[1], +m[2]] : null; };
function sortItems() {
  items.sort((a, b) => { const A = parseName(a.name) || ["", 0], B = parseName(b.name) || ["", 0]; return A[0] === B[0] ? B[1] - A[1] : (A[0] < B[0] ? 1 : -1); });
}
function nextName(d) {
  const day = ymd(d || new Date()); let n = 0;
  for (const it of items) { const p = parseName(it.name); if (p && p[0] === day) n = Math.max(n, p[1]); }
  return day + "_" + (n + 1);
}
const EXT = { image: ["jpg", "jpeg", "png", "heic", "heif", "webp", "gif"], audio: ["m4a", "mp3", "wav", "aac", "webm", "ogg", "caf", "mp4"], text: ["txt", "md"], pdf: ["pdf"] };
function typeOf(ext, mime) {
  ext = (ext || "").toLowerCase(); mime = mime || "";
  for (const t in EXT) if (EXT[t].includes(ext)) return t === "audio" && mime.startsWith("video") ? "file" : t;
  if (mime.startsWith("image/")) return "image"; if (mime.startsWith("audio/")) return "audio"; if (mime.startsWith("text/")) return "text"; if (mime === "application/pdf") return "pdf";
  return "file";
}
const extOf = (fn) => { const i = fn.lastIndexOf("."); return i > 0 ? fn.slice(i + 1).toLowerCase() : ""; };
const MIME = { jpg: "image/jpeg", jpeg: "image/jpeg", png: "image/png", heic: "image/heic", webp: "image/webp", gif: "image/gif", m4a: "audio/mp4", mp4: "audio/mp4", mp3: "audio/mpeg", wav: "audio/wav", aac: "audio/aac", webm: "audio/webm", ogg: "audio/ogg", caf: "audio/x-caf", txt: "text/plain", md: "text/markdown", pdf: "application/pdf" };

async function addItem(it) {
  it.name = it.name || nextName(); it.created = it.created || Date.now();
  await dbPut(it); items.push(it); sortItems(); sel = items.indexOf(it); renderFeed(true);
  sound("act"); flash("Salvato " + it.name);
  return it;
}

/* ============ Audio: clic come in CCD-1 / DSP-1 ============ */
let actx = null, noiseBuf = null;
function audio() {
  if (actx) { if (actx.state === "suspended") actx.resume(); return actx; }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    noiseBuf = actx.createBuffer(1, Math.round(actx.sampleRate * 0.08), actx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { actx = null; }
  return actx;
}
function tick(t0, freq, dur, gain, hp) {
  const a = actx, src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  src.buffer = noiseBuf; f.type = "bandpass"; f.frequency.value = hp; f.Q.value = 1.2;
  g.gain.setValueAtTime(gain, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f).connect(g).connect(a.destination); src.start(t0, Math.random() * 0.03, dur + 0.01);
  const o = a.createOscillator(), og = a.createGain(); o.frequency.value = freq; o.type = "square";
  og.gain.setValueAtTime(gain * 0.25, t0); og.gain.exponentialRampToValueAtTime(0.0001, t0 + dur * 0.6);
  o.connect(og).connect(a.destination); o.start(t0); o.stop(t0 + dur);
}
const SND = {
  detent: [[3200, 0.006, 0.12, 6000]], browse: [[2000, 0.007, 0.10, 3800]], stop: [[700, 0.012, 0.16, 1200]],
  key: [[2600, 0.005, 0.09, 5200]], set: [[1500, 0.020, 0.30, 2600]], menu: [[1100, 0.022, 0.30, 2000]],
  act: [[900, 0.035, 0.40, 2600], [1400, 0.012, 0.12, 2800, 0.05]],
};
let lastSnd = 0;
function sound(k) {
  if (S.sound !== "1" || !actx) return;
  const now = performance.now(); if ((k === "detent" || k === "browse") && now - lastSnd < 18) return; lastSnd = now;
  const t0 = actx.currentTime + 0.002;
  for (const [f, d, g, bp, dt] of SND[k]) tick(t0 + (dt || 0), f, d, g, bp);
}
["touchend", "click"].forEach((t) => document.addEventListener(t, () => { if (S.sound === "1") audio(); }, true));

/* ============ Display 1 ============ */
const MODES = [
  { k: "text", l: "TESTO", h: "ruota per scrivere" },
  { k: "photo", l: "FOTO", h: "shift: scatta" },
  { k: "scan", l: "SCANSIONE", h: "shift: scansiona" },
  { k: "audio", l: "AUDIO", h: "shift: registra" },
  { k: "file", l: "FILE", h: "shift: aggiungi" },
];
let msg = "", msgT = 0;
function flash(t) { msg = t; clearTimeout(msgT); msgT = setTimeout(() => { msg = ""; d1(); }, 1800); d1(); }
function d1() {
  const m = MODES[S.mode];
  let a = m.l;
  if (view === "menu") a = "MENU";
  else if (view === "detail") { const it = items[sel]; a = it ? it.name : ""; }
  if (rec) a = "REC " + clock((performance.now() - rec.t0) / 1000);
  if (msg) a = msg;
  $("d1a").textContent = a;
  $("d1").classList.toggle("meter", !!rec && !msg);
}
const clock = (s) => Math.floor(s / 60) + ":" + pad(Math.floor(s % 60));
function setMode(dir) {
  if (rec) { sound("stop"); return; }
  S.mode = (S.mode + dir + MODES.length) % MODES.length; saveS(); sound("menu"); msg = ""; d1();
}
function msBtn(el, dir) {
  el.addEventListener("pointerdown", (e) => {
    e.preventDefault(); audio(); el.classList.add("down");
    if (land) { moveCaret(dir, true); sound("browse"); } else setMode(dir);
  });
  ["pointerup", "pointercancel", "pointerleave"].forEach((t) => el.addEventListener(t, () => el.classList.remove("down")));
}
msBtn($("prev"), -1); msBtn($("next"), 1);
$("theme").addEventListener("click", () => { S.theme = S.theme === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = S.theme; saveS(); drawDial(); drawStrip(); renderFeed(); if (view === "menu") renderMenu(); sound("set"); });
$("d1").addEventListener("click", () => { audio(); if (land || rec) { sound("stop"); return; } view === "menu" ? closeView() : openMenu(); });

/* ============ Display 2: feed, dettaglio, menu ============ */
const feed = $("feed"), d2 = $("d2");
let sel = 0, view = "feed";
const urls = new Map();
const urlOf = (it) => { if (!urls.has(it.name)) urls.set(it.name, URL.createObjectURL(it.blob)); return urls.get(it.name); };
function fmtSize(n) { return n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB"; }
function drawWave(cv, peaks, prog) {
  const w = cv.clientWidth || 300, h = cv.clientHeight || 34; cv.width = Math.round(w * DPR); cv.height = Math.round(h * DPR);
  const c = cv.getContext("2d"), ink = getComputedStyle(document.documentElement).getPropertyValue("--ink").trim();
  c.fillStyle = ink; const n = peaks && peaks.length ? peaks.length : 0, bw = cv.width / Math.max(n, 1);
  for (let i = 0; i < n; i++) {
    const v = Math.max(0.04, peaks[i]), bh = v * cv.height;
    const x = Math.round(i * bw + bw * 0.2), bwi = Math.max(2, Math.round(bw * 0.6)), y = Math.round((cv.height - bh) / 2);
    if (prog != null && i / n > prog) { c.strokeStyle = ink; c.lineWidth = DPR; c.strokeRect(x + DPR / 2, y + DPR / 2, bwi - DPR, Math.max(DPR, bh - DPR)); }
    else c.fillRect(x, y, bwi, bh);
  }
  if (!n) c.fillRect(0, Math.round(cv.height / 2), cv.width, DPR);
}
function contentEl(it, full) {
  const f = document.createDocumentFragment();
  if (it.type === "text") { const d = document.createElement("div"); d.className = "tx"; d.textContent = it.text; f.appendChild(d); }
  else if (it.type === "image") { const im = new Image(); im.src = urlOf(it); im.alt = ""; f.appendChild(im); }
  else if (it.type === "audio") {
    const cv = document.createElement("canvas"); cv.className = "wf"; f.appendChild(cv);
    const d = document.createElement("div"); d.className = "fl"; d.textContent = it.dur ? clock(it.dur) : (it.orig || "audio"); f.appendChild(d);
    requestAnimationFrame(() => drawWave(cv, it.peaks));
  } else {
    const d = document.createElement("div"); d.className = "fl"; d.textContent = (it.orig || it.name + "." + it.ext) + "  ·  " + fmtSize(it.blob ? it.blob.size : 0); f.appendChild(d);
  }
  return f;
}
function renderFeed(scroll) {
  feed.innerHTML = "";
  if (!items.length) { d1(); return; }
  sel = Math.max(0, Math.min(items.length - 1, sel));
  items.forEach((it, i) => {
    const el = document.createElement("div"); el.className = "it" + (i === sel ? " sel" : ""); el.dataset.i = i;
    const nm = document.createElement("div"); nm.className = "nm"; nm.textContent = it.name; el.appendChild(nm);
    el.appendChild(contentEl(it)); feed.appendChild(el);
  });
  if (scroll) showSel(); d1();
}
function setSel(i) {
  i = Math.max(0, Math.min(items.length - 1, i)); if (i === sel) return false;
  const o = feed.children[sel]; if (o) o.classList.remove("sel");
  sel = i; const n = feed.children[sel]; if (n) n.classList.add("sel"); showSel(); return true;
}
function showSel() {
  const el = feed.children[sel]; if (!el) return;
  const top = el.offsetTop, bot = top + el.offsetHeight, h = feed.clientHeight;
  if (top < feed.scrollTop) feed.scrollTop = top; else if (bot > feed.scrollTop + h) feed.scrollTop = Math.min(top, bot - h);
}
feed.addEventListener("click", (e) => {
  const el = e.target.closest(".it"); if (!el) return; const i = +el.dataset.i;
  if (i === sel) openDetail(); else { setSel(i); sound("browse"); }
});

let player = null;
function openDetail() {
  const it = items[sel]; if (!it) return;
  const dt = $("detail"); dt.innerHTML = ""; view = "detail"; d2.className = "box show-detail"; dt.scrollTop = 0;
  if (it.type === "pdf") { const fr = document.createElement("iframe"); fr.src = urlOf(it); dt.style.padding = "0"; dt.appendChild(fr); }
  else { dt.style.padding = ""; dt.appendChild(contentEl(it, true)); }
  if (it.type === "audio") {
    player = new Audio(urlOf(it)); player.play().catch(() => {});
    const cv = dt.querySelector("canvas"), tl = dt.querySelector(".fl");
    const upd = () => { if (!player) return; drawWave(cv, it.peaks, player.duration ? player.currentTime / player.duration : 0); tl.textContent = clock(player.currentTime) + " / " + clock(player.duration || it.dur || 0); if (!player.paused) requestAnimationFrame(upd); };
    player.onplay = upd; player.onpause = upd; player.onseeked = upd; requestAnimationFrame(upd);
  }
  if (it.type === "file") {}
  sound("set"); d1();
}
function closeView() {
  if (player) { player.pause(); player = null; }
  view = "feed"; d2.className = "box"; sound("menu"); d1();
}

/* Menu (FX): si apre toccando il Display 1 */
let menuSel = 0, confirmKey = "";
function menuRows() {
  const it = items[sel], mon = it ? it.name.slice(0, 4) : ymd(new Date()).slice(0, 4);
  return [
    { k: "expM", l: "Esporta mese", v: "20" + mon.slice(0, 2) + "-" + mon.slice(2) },
