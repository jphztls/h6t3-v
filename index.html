<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<!-- Privacy: il browser non può inviare dati a nessun altro indirizzo. Tutto resta sul telefono. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob: mediastream:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">

<style>
/* --- Token Grado Zero: solo bianco e nero, linee 1px, un font e una dimensione --- */
:root {
  --surface: #ffffff; --ink: #000000; --on-ink: #ffffff;
  --line: var(--ink); --surface-inverse: var(--ink); --ink-inverse: var(--on-ink);
  --font-sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
  --border-hairline: 1px; --control-height: 28px;
  --text: 400 16px/22px var(--font-sans);
  --led: #ff3b30;
  color-scheme: light;
}
:root[data-theme="dark"] { --surface: #000000; --ink: #ffffff; --on-ink: #000000; color-scheme: dark; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
html, body { margin: 0; position: fixed; inset: 0; overflow: hidden; overscroll-behavior: none; background: var(--surface); color: var(--ink); font: var(--text); }
button { font: var(--text); color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.box { border: var(--border-hairline) solid var(--line); }

#app { position: fixed; left: 0; right: 0; top: 0; bottom: 0; margin: 0 auto; max-width: 430px; display: flex; flex-direction: column;
  padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
.top { flex: none; display: flex; align-items: center; justify-content: space-between; height: 30px; padding: 0 var(--space-3); }
.top .theme { width: var(--control-height); height: var(--control-height); display: flex; align-items: center; justify-content: flex-end; }

/* Display 2 */
#d2 { position: relative; flex: 1; min-height: 120px; margin: var(--space-1) var(--space-3) 0; overflow: hidden; }
.pane { position: absolute; inset: 0; display: none; background: var(--surface); }
.pane.on { display: block; }
.scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; touch-action: pan-y; }
.it { padding: var(--space-2) var(--space-3) var(--space-3); border-top: var(--border-hairline) solid var(--line); }
.it:first-child { border-top: 0; }
.it .nm { display: inline-block; padding: 0 3px; margin: 0 -3px 4px; font-variant-numeric: tabular-nums; }
.it.sel .nm { background: var(--surface-inverse); color: var(--ink-inverse); }
.it .tx { white-space: pre-wrap; word-wrap: break-word; display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; }
.it img { display: block; width: 100%; max-height: 260px; object-fit: contain; object-position: left center; }
.it canvas.wf { display: block; width: 100%; height: 34px; }
.it .part + .part { margin-top: var(--space-2); }
#detail { padding: var(--space-3); }
#detail .tx { white-space: pre-wrap; word-wrap: break-word; }
#detail img { display: block; width: 100%; height: auto; }
:root[data-theme="dark"] img.inv { filter: invert(1); }   /* scansioni in grigio/BN: bianco su nero col tema scuro */
#detail canvas.wf { display: block; width: 100%; height: 80px; }
#detail .part + .part { margin-top: var(--space-3); }
#detail iframe { width: 100%; height: 70vh; border: 0; background: #fff; }

/* Calendario */
#cal { padding: var(--space-3); }
.cal-h { height: 32px; display: flex; align-items: center; }
.cal-g { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-g div { height: 40px; display: flex; align-items: center; justify-content: center; border: var(--border-hairline) solid transparent; font-variant-numeric: tabular-nums; }
.cal-g .has { background: var(--surface-inverse); color: var(--ink-inverse); }
.cal-g .sel { border-color: var(--line); }
.cal-g .has.sel { outline: var(--border-hairline) solid var(--line); outline-offset: 2px; }

/* Mirino */
#cam video, #cam canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#cam video { object-fit: cover; transform-origin: 50% 50%; }
#cam #still { display: none; }
#cam.frozen #still { display: block; }
#cam.frozen video { visibility: hidden; }
#ov { touch-action: none; }

/* Barra: frecce (un tasto unico) + Display 1 su una riga */
#bar { flex: none; display: flex; height: 44px; margin: var(--space-2) var(--space-3) 0; }
#arrows { flex: none; display: flex; height: 100%; }
#arrows button { height: 100%; width: var(--bh, 44px); flex: none; display: flex; align-items: center; justify-content: center; }
#arrows button + button { border-left: var(--border-hairline) solid var(--line); }
#arrows button.down { background: var(--surface-inverse); color: var(--ink-inverse); }
#arrows svg { width: 12px; height: 12px; fill: currentColor; }
#d1 { position: relative; flex: 1; min-width: 0; overflow: hidden; }
#arrows { order: 2; margin-left: -1px; }
#d1 .l1 { position: absolute; inset: 0; display: flex; align-items: center; gap: var(--space-3); padding: 0 var(--space-3); white-space: nowrap; overflow: hidden; }
#d1 .l1 span { overflow: hidden; text-overflow: ellipsis; }
#d1 .l1 #d1v { flex: 1; min-width: 0; }
#d1c { position: absolute; top: 0; bottom: 0; right: 0; width: 45%; height: 100%; display: none; }
#d1.meter #d1c { display: block; }
#ed { display: none; position: absolute; inset: 0; padding: 0 var(--space-3); overflow: hidden; white-space: pre; align-items: center; }
#ed .car { display: inline-block; width: 0; border-left: var(--border-hairline) solid var(--ink); margin-right: -1px; height: 20px; vertical-align: -4px; animation: blink 1s steps(1) infinite; }
#ed .sx { background: var(--surface-inverse); color: var(--ink-inverse); }
@keyframes blink { 50% { visibility: hidden; } }

/* Controlli: Shift alto quanto la ghiera, LED pieno al centro della curva */
#ctl { position: relative; flex: none; display: flex; align-items: center; justify-content: space-between; padding: var(--space-4) var(--space-3) var(--space-2); }
#shift { position: relative; width: 72px; border-radius: 9999px; touch-action: none; }
#shift.down { background: var(--surface-inverse); }
.led { position: absolute; width: 16px; height: 16px; border-radius: 50%; background: var(--ink); }
#shift.down .led { background: var(--on-ink); }
.led.rec { background: var(--led) !important; animation: blink 1s steps(1) infinite; }
#dial { display: block; touch-action: none; }
#strip { display: none; touch-action: none; }
#kb { display: none; }

/* --- Orizzontale: Display 1 ridotto (0,7) + 4 file di tastiera + Shift e striscia --- */
body.land #app { max-width: none; display: grid; grid-template-rows: .7fr 1fr 1fr 1fr 1fr 1fr; grid-template-columns: minmax(0, 1fr); row-gap: 6px;
  padding: var(--space-2) max(var(--space-2), env(safe-area-inset-right)) max(var(--space-2), env(safe-area-inset-bottom)) max(var(--space-2), env(safe-area-inset-left)); }
body.land .top, body.land #d2, body.land #dial { display: none; }
body.land #bar { grid-row: 1; height: auto; margin: 0; min-height: 0; min-width: 0; }
body.land #ed { display: flex; }
body.land #d1 .l1, body.land #d1c { display: none; }
body.land #kb { grid-row: 2 / 6; display: flex; flex-direction: column; gap: 1px; min-height: 0; background: var(--line); border: var(--border-hairline) solid var(--line); }
.kr { display: flex; gap: 1px; flex: 1; min-height: 0; }
.k { flex: 1 1 0; min-width: 0; display: flex; align-items: flex-start; justify-content: flex-start; padding: 4px 7px; background: var(--surface); touch-action: none; overflow: hidden; }
.k.w15 { flex-grow: 1.5; } .k.w6 { flex-grow: 6; }
.k.down, .k.lit { background: var(--surface-inverse); color: var(--ink-inverse); }
body.land #ctl { grid-row: 6; padding: 0; gap: 28px; min-height: 0; }
body.land #shift { width: 140px; flex: none; align-self: stretch; }
body.land #strip { display: block; flex: 1; align-self: stretch; min-width: 0; }

#fin, #fzip { display: none; }
</style>
</head>
<body>
<div id="app">
  <div class="top"><span>JRN-1</span><button class="theme" id="theme" aria-label="Tema"><svg viewBox="0 0 16 16" width="14" height="14"><circle cx="8" cy="8" r="8" fill="currentColor"/></svg></button></div>
  <div id="d2" class="box">
    <div id="feed" class="pane scroll on"></div>
    <div id="detail" class="pane scroll"></div>
    <div id="cal" class="pane"></div>
    <div id="cam" class="pane"><video id="vid" playsinline muted autoplay></video><canvas id="still"></canvas><canvas id="ov"></canvas></div>
  </div>
  <div id="bar" class="">
    <div id="arrows" class="box">
      <button id="prev" aria-label="Modalità precedente"><svg viewBox="0 0 12 12"><path d="M9 1 L3 6 L9 11 Z"/></svg></button>
      <button id="next" aria-label="Modalità successiva"><svg viewBox="0 0 12 12"><path d="M3 1 L9 6 L3 11 Z"/></svg></button>
    </div>
    <div id="d1" class="box"><div class="l1"><span id="d1m"></span><span id="d1v"></span></div><canvas id="d1c"></canvas><div id="ed"></div></div>
  </div>
  <div id="kb"></div>
  <div id="ctl">
    <button id="shift" class="box" aria-label="Shift"><i class="led" id="led"></i></button>
    <canvas id="dial" aria-label="Ghiera"></canvas>
    <canvas id="strip" class="box" aria-label="Striscia di scorrimento"></canvas>
  </div>
</div>
<input type="file" id="fin">
<input type="file" id="fzip" accept=".zip,application/zip">
<script src="scan.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
["gesturestart", "gesturechange", "gestureend"].forEach((t) => document.addEventListener(t, (e) => e.preventDefault()));
document.addEventListener("touchmove", (e) => { if (!e.target.closest || !e.target.closest(".scroll")) e.preventDefault(); }, { passive: false });
document.addEventListener("dblclick", (e) => e.preventDefault());
const DPR = Math.min(window.devicePixelRatio || 1, 3);
const ink = () => getComputedStyle(document.documentElement).getPropertyValue("--ink").trim();

const S = { mode: "consulta", lastCap: "registra", theme: "dark", sound: "1", filter: null, folders: ["memo", "idee", "journal", "agenda", "lavoro"], scanFilter: "migliorato" };
try { Object.assign(S, JSON.parse(store.get("jrn1-set", "{}"))); } catch (e) {}
const saveS = () => store.set("jrn1-set", JSON.stringify(S));
document.documentElement.dataset.theme = S.theme;

/* ============ Archivio interno: IndexedDB, solo sul telefono ============ */
let db = null;
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open("jrn1", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("items", { keyPath: "name" });
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
const tx = (mode, fn) => new Promise((res, rej) => { const t = db.transaction("items", mode), s = t.objectStore("items"); const out = fn(s); t.oncomplete = () => res(out && out.result); t.onerror = () => rej(t.error); });
const dbAll = () => tx("readonly", (s) => s.getAll());
const dbPut = (it) => tx("readwrite", (s) => s.put(it));
const dbDel = (name) => tx("readwrite", (s) => s.delete(name));
const dbClear = () => tx("readwrite", (s) => s.clear());

let items = [];                                       // dal più recente al più vecchio
const pad = (n, l) => String(n).padStart(l || 2, "0");
const ymd = (d) => pad(d.getFullYear() % 100) + pad(d.getMonth() + 1) + pad(d.getDate());
const ymdDate = (s) => new Date(2000 + +s.slice(0, 2), +s.slice(2, 4) - 1, +s.slice(4, 6), 12);
const parseName = (n) => { const m = /^(\d{6})_(\d+)$/.exec(n); return m ? [m[1], +m[2]] : null; };
function sortItems() {
  items.sort((a, b) => { const A = parseName(a.name) || ["", 0], B = parseName(b.name) || ["", 0]; return A[0] === B[0] ? B[1] - A[1] : (A[0] < B[0] ? 1 : -1); });
}
function nextName(d) {
  const day = ymd(d || new Date()); let n = 0;
  for (const it of items) { const p = parseName(it.name); if (p && p[0] === day) n = Math.max(n, p[1]); }
  return day + "_" + (n + 1);
}
const EXT = { image: ["jpg", "jpeg", "png", "heic", "heif", "webp", "gif"], audio: ["m4a", "mp3", "wav", "aac", "webm", "ogg", "caf", "mp4"], text: ["txt", "md"], pdf: ["pdf"] };
function typeOf(ext, mime) {
  ext = (ext || "").toLowerCase(); mime = mime || "";
  for (const t in EXT) if (EXT[t].includes(ext)) return t === "audio" && mime.startsWith("video") ? "file" : t;
  if (mime.startsWith("image/")) return "image"; if (mime.startsWith("audio/")) return "audio"; if (mime.startsWith("text/")) return "text"; if (mime === "application/pdf") return "pdf";
  return "file";
}
const extOf = (fn) => { const i = fn.lastIndexOf("."); return i > 0 ? fn.slice(i + 1).toLowerCase() : ""; };
const MIME = { jpg: "image/jpeg", jpeg: "image/jpeg", png: "image/png", heic: "image/heic", webp: "image/webp", gif: "image/gif", m4a: "audio/mp4", mp4: "audio/mp4", mp3: "audio/mpeg", wav: "audio/wav", aac: "audio/aac", webm: "audio/webm", ogg: "audio/ogg", caf: "audio/x-caf", txt: "text/plain", md: "text/markdown", pdf: "application/pdf" };
const parts = (it) => [it].concat(it.att || []);

async function addItem(it) {
  it.name = it.name || nextName(); it.created = it.created || Date.now();
  await dbPut(it); items.push(it); sortItems(); S.filter = null; renderFeed(); setSel(vis().indexOf(it), true);
  sound("act"); flash("Salvato " + it.name);
  return it;
}
async function attach(it, part) {
  it.att = it.att || []; it.att.push(part); await dbPut(it); urls.delete(it.name + "#" + (it.att.length)); renderFeed(); sound("act"); flash(it.name + " +" + String.fromCharCode(96 + it.att.length));
}
async function partFromFile(f) {
  const ext = extOf(f.name) || (f.type.split("/")[1] || "bin"), type = typeOf(ext, f.type);
  const p = { type, ext, mime: f.type || MIME[ext] || "application/octet-stream", orig: f.name || "" };
  if (type === "text") p.text = await f.text(); else p.blob = f;
  if (type === "audio") { const a = await peaksOf(f); if (a) Object.assign(p, a); }
  return p;
}

/* ============ Suoni: clic di interfaccia + tastiera meccanica ============ */
let actx = null, noiseBuf = null;
function audio() {
  if (actx) { if (actx.state === "suspended") actx.resume(); return actx; }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    noiseBuf = actx.createBuffer(1, Math.round(actx.sampleRate * 0.08), actx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { actx = null; }
  return actx;
}
function noise(t0, dur, gain, type, freq, q) {
  const a = actx, src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  src.buffer = noiseBuf; f.type = type; f.frequency.value = freq; f.Q.value = q || 1;
  g.gain.setValueAtTime(gain, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f).connect(g).connect(a.destination); src.start(t0, Math.random() * 0.05, dur + 0.01);
}
function tone(t0, f0, f1, dur, gain, type) {
  const a = actx, o = a.createOscillator(), g = a.createGain(); o.type = type || "sine";
  o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
  g.gain.setValueAtTime(gain, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(a.destination); o.start(t0); o.stop(t0 + dur + 0.01);
}
function tick(t0, freq, dur, gain, hp) { noise(t0, dur, gain, "bandpass", hp, 1.2); tone(t0, freq, freq, dur * 0.6, gain * 0.25, "square"); }
const SND = {
  detent: [[3200, 0.006, 0.12, 6000]], browse: [[2000, 0.007, 0.10, 3800]], stop: [[700, 0.012, 0.16, 1200]],
  set: [[1500, 0.020, 0.30, 2600]], menu: [[1100, 0.022, 0.30, 2000]],
  act: [[900, 0.035, 0.40, 2600], [1400, 0.012, 0.12, 2800, 0.05]],
};
let lastSnd = 0;
function sound(k) {
  if (S.sound !== "1" || !actx) return;
  const now = performance.now(); if ((k === "detent" || k === "browse") && now - lastSnd < 18) return; lastSnd = now;
  const t0 = actx.currentTime + 0.002;
  for (const [f, d, g, bp, dt] of SND[k]) tick(t0 + (dt || 0), f, d, g, bp);
}
/* Tasto meccanico: clic dello stelo + "thock" del fondo; rilascio più leggero. I tasti grandi suonano più bassi. */
function mech(down, big) {
  if (S.sound !== "1" || !actx) return;
  const t0 = actx.currentTime + 0.002, v = 0.9 + Math.random() * 0.2;
  if (down) {
    noise(t0, 0.012, 0.45 * v, "highpass", 2400 * v, 0.7);
    noise(t0 + 0.004, 0.03, 0.30, "bandpass", (big ? 520 : 900) * v, 1.4);
    tone(t0 + 0.003, (big ? 150 : 210) * v, (big ? 80 : 110) * v, 0.05, big ? 0.45 : 0.32);
  } else {
    noise(t0, 0.008, 0.18 * v, "highpass", 3200 * v, 0.7);
    tone(t0, 320 * v, 200 * v, 0.02, 0.08);
  }
}
["touchend", "click"].forEach((t) => document.addEventListener(t, () => { if (S.sound === "1") audio(); }, true));

/* ============ Modalità ============ */
const VIEW = ["consulta", "calendario", "cartelle", "edit", "elimina", "archivio"];
const CAP = ["registra", "foto", "scansione", "file", "testo"];
const LABEL = { consulta: "CONSULTA", calendario: "CALENDARIO", cartelle: "CARTELLE", edit: "EDIT", elimina: "ELIMINA", archivio: "ARCHIVIO", registra: "REGISTRA", foto: "FOTO", scansione: "SCANSIONE", file: "FILE", testo: "TESTO" };
const M = {};                                         // gestori: enter, leave, dial, sdial, center, shift, d1
let mode = VIEW.includes(S.mode) || CAP.includes(S.mode) ? S.mode : "consulta";
function setMode(k) {
  if (k === mode) return;
  if (rec) { sound("stop"); return; }
  const old = M[mode]; if (old && old.leave) old.leave();
  mode = k; S.mode = k; if (CAP.includes(k)) S.lastCap = k; saveS();
  showPane("feed"); M[k].enter && M[k].enter(); d1();
}
function cycle(dir, cap) {
  const g = cap ? CAP : VIEW, i = g.indexOf(mode);
  setMode(i < 0 ? (cap ? S.lastCap : "consulta") : g[(i + dir + g.length) % g.length]); sound("menu");
}
function showPane(id) { for (const p of document.querySelectorAll(".pane")) p.classList.toggle("on", p.id === id); }

/* Display 1: nome della modalità + contenuto */
let msg = "", msgT = 0;
function flash(t) { msg = t; clearTimeout(msgT); msgT = setTimeout(() => { msg = ""; d1(); }, 1600); d1(); }
function d1() {
  $("d1m").textContent = LABEL[mode];
  $("d1v").textContent = msg || (M[mode].d1 ? M[mode].d1() : "");
  $("d1").classList.toggle("meter", !!rec && !msg);
}
const clock = (s) => Math.floor(s / 60) + ":" + pad(Math.floor(s % 60));

function arrowBtn(el, dir) {
  el.addEventListener("pointerdown", (e) => {
    e.preventDefault(); audio(); el.classList.add("down");
    if (land) { moveCaret(dir, true, shiftHeld()); if (shiftHeld()) shUsed = true; sound("browse"); return; }
    if (shiftHeld()) shUsed = true;
    cycle(dir, shiftHeld());
  });
  ["pointerup", "pointercancel", "pointerleave"].forEach((t) => el.addEventListener(t, () => el.classList.remove("down")));
}
arrowBtn($("prev"), -1); arrowBtn($("next"), 1);
$("theme").addEventListener("click", () => { audio(); S.theme = S.theme === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = S.theme; saveS(); drawDial(); drawStrip(); renderFeed(); if (mode === "calendario") renderCal(); sound("set"); });

/* ============ Feed ============ */
const feed = $("feed");
let sel = 0;
const vis = () => (S.filter && mode === "cartelle" ? items.filter((i) => i.folder === S.filter) : items);
const cur = () => vis()[sel];
const urls = new Map();
function urlOf(it, k) { const key = it.name + "#" + (k || 0); if (!urls.has(key)) urls.set(key, URL.createObjectURL(parts(it)[k || 0].blob)); return urls.get(key); }
/* Filtro delle scansioni: il file resta solo raddrizzato, il filtro si calcola quando si guarda */
const fcache = new Map();
function filteredUrl(it, k) {
  const p = parts(it)[k], key = it.name + "#" + k + "#" + p.filter + "#" + p.blob.size;
  if (!fcache.has(key)) fcache.set(key, (async () => {
    const bm = await createImageBitmap(p.blob), s = Math.min(1, 1600 / Math.max(bm.width, bm.height));
    const c = canvasOf(Math.round(bm.width * s), Math.round(bm.height * s)), x = c.getContext("2d"); x.drawImage(bm, 0, 0, c.width, c.height);
    const img = enhance(x.getImageData(0, 0, c.width, c.height), p.filter); x.putImageData(img, 0, 0);
    const b = await toBlob(c, 0.85); freeCanvas(c); return URL.createObjectURL(b);
  })());
